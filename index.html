function addComboToCart(){
  if(!curCombo || !selTier) return;
  const cid='combo_'+curCombo.id;
  const key=cid+'_'+selTier.ml;
  const found=CART.find(i=>i.key===key);
  if(found) found.qty+=comboQty;
  else CART.push({ key, id:cid, tipo:'combo', nombre:curCombo.nombre, marca:'Combo', categoria:'Promoción', img:imgsOf(curCombo)[0], ml:selTier.ml, precio:selTier.precio, antes:selTier.antes||null, qty:comboQty });
  (curCombo.addons||[]).forEach((a,i)=>{
    if(!selAddons.has(i)) return;
    const akey='addon_'+curCombo.id+'_'+i;
    const f=CART.find(x=>x.key===akey);
    if(f) f.qty+=1;
    else CART.push({ key:akey, id:akey, tipo:'addon', nombre:a.nombre, marca:'Combínalo', img:a.imagen_url||'', ml:a.ml||'', precio:Number(a.precio), antes:Number(a.antes)||null, qty:1 });
  });
  saveCart(); toast(`Añadido: ${curCombo.nombre}`);
  closeProduct(); openCart();
}

/* ================= Carrito ================= */
function _addToCartCore(){
  if(!curProduct || !selSize) return false;
  let addQty = selSize.qty||1;
  const s = stockDe(curProduct);
  if(s!=null){ const restante = s - qtyEnCarrito(curProduct.id); if(restante<=0){ toast('No hay más stock disponible'); return false; } if(addQty>restante) addQty=restante; }
  const key = curProduct.id + '_' + selSize.size;
  const found = CART.find(i=>i.key===key);
  if(found) found.qty += addQty;
  else CART.push({ key, id:curProduct.id, nombre:curProduct.nombre, marca:curProduct.marca, categoria:curProduct.categoria, img:imgsOf(curProduct)[0], ml:selSize.size, precio:selSize.price, precio_may:selSize.may||0, qty:addQty });
  saveCart();
  return true;
}
function addToCartOnly(){
  const p=curProduct, sz=selSize;
  if(!_addToCartCore()) return;
  if(regaloDisponible()) toast('🎁 ¡Ganaste un regalo! Elígelo en tu pedido');
  else toast(`Añadido: ${p.nombre} (${mlLabel(sz.size)})`);
  closeProduct();
}
function addToCart(){
  const p=curProduct, sz=selSize;
  if(!_addToCartCore()) return;
  if(regaloDisponible()) toast('🎁 ¡Ganaste un regalo! Elígelo en tu pedido');
  else toast(`Añadido: ${p.nombre} (${mlLabel(sz.size)})`);
  closeProduct(); openCart();
}

}
function saveCart(){ localStorage.setItem('cart_'+CONFIG.TIENDA_NOMBRE, JSON.stringify(CART)); renderCart(); }

/* Agregar un decant de regalo elegido por el cliente */
function addGift(promoId){
  const g = GIFT_STATUS.find(x=>x.promoId===promoId); if(!g) return;
  const chosen = CART.filter(i=>i.tipo==='regalo'&&i.promoId===promoId).length;
  if(chosen>=g.giftsEarned){ toast('Ya elegiste todos tus regalos'); return; }
  const sel=document.getElementById('giftSel_'+promoId);
  const pid = sel ? sel.value : (g.opciones[0]&&g.opciones[0].id);
  const opt = g.opciones.find(o=>o.id===pid); if(!opt){ toast('Elige un perfume'); return; }
  CART.push({ key:'regalo_'+promoId+'_'+pid+'_'+Date.now(), id:'regalo_'+pid, tipo:'regalo', promoId, nombre:opt.nombre, marca:'Regalo', img:opt.img||'', ml:g.ml, precio:0, qty:1 });
  saveCart(); toast('🎁 ¡Regalo agregado: '+opt.nombre+'!');
}
/* ¿Hay un regalo recién disponible para elegir? */
function regaloDisponible(){
  return (GIFT_STATUS||[]).some(g=>{
    const chosen = CART.filter(i=>i.tipo==='regalo'&&i.promoId===g.promoId).length;
    return g.giftsEarned>chosen && g.opciones.length;
  });
}

/* Próximo tramo de precio que existe entre los perfumes que YA están en el carrito */
function proximoTramoCarrito(){
  const total = unidadesCarrito();
  const mins = new Set();
  CART.forEach(i=>{ const p=PROD_BY_ID[i.id]; if(p) tiersDe(p).forEach(t=>mins.add(t.min)); });
  const arr = [...mins].sort((a,b)=>a-b);
  const alcanzado = arr.filter(m=>m<=total).pop() || null;
  const siguiente = arr.find(m=>m>total) || null;
  return { total, tieneMayoreo: mins.size>0, alcanzado, siguiente };
}
function mayorBanner(){
  const { total, tieneMayoreo, siguiente } = proximoTramoCarrito();
  if(!tieneMayoreo) return '';
  if(siguiente){
    const faltan = siguiente - total;
    return `<div class="mayor-banner"><span class="mb-ic">🔥</span><span class="mb-txt">¡Te faltan <b>${faltan} perfume${faltan===1?'':'s'}</b> para bajar de precio!</span></div>`;
  }
  return `<div class="mayor-banner ok"><span class="mb-ic">🎉</span><span class="mb-txt">¡Ya tienes el <b>mejor precio</b> por mayor en tu pedido!</span></div>`;
}
function renderCart(){

  if(!CART.length){
    $('#cartList').innerHTML = `<div class="cart-empty"><b style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--cream)">Tu pedido está vacío</b><br>Añade tus fragancias favoritas.</div>`;

  let R = window.PROMOS_ENGINE.computeCart(pricedCart(), PROD_BY_ID, PROMOS);

    }

  $('#cartList').innerHTML = mayorBanner() + itemsHtml + giftHtml
    + (R.upsells.length ? R.upsells.map(u=>`<div class="upsell">🌟 ${esc(u)}</div>`).join('') : '')
    + (R.comboDisc.length ? R.comboDisc.map(c=>`<div class="promo-line">🎁 ${esc(c.nombre)}: −${fmt(c.monto)}</div>`).join('') : '');

  $('#cartList').querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>chgQty(b.dataset.inc,1));
  $('#cartList').querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>chgQty(b.dataset.dec,-1));
  $('#cartList').querySelectorAll('[data-qset]').forEach(inp=>inp.onchange=()=>setQty(inp.dataset.qset, inp.value));
  $('#cartList').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{CART=CART.filter(i=>i.key!==b.dataset.rm); saveCart();});
  $('#cartList').querySelectorAll('[data-giftadd]').forEach(b=>b.onclick=()=>addGift(b.dataset.giftadd));

  const yapeOn = payMethod==='yape' && CONFIG.YAPE_NUMERO;
  $('#cartBot').style.display='block';
  $('#cartBot').innerHTML = `
    ${entregaToggleHTML('c')}
    ${CONFIG.YAPE_NUMERO ? `<div class="pay-toggle">
      <button class="${payMethod==='yape'?'on':''}" data-pay="yape">Pagar con Yape</button>
      <button class="${payMethod==='coordinar'?'on coord':''}" data-pay="coordinar">Coordinar pago</button>
    </div>`:''}
    ${yapeOn ? `<div class="yape-box">Yape a <b>${esc(CONFIG.YAPE_NUMERO)}</b>${CONFIG.YAPE_NOMBRE?` (<b>${esc(CONFIG.YAPE_NOMBRE)}</b>)`:''} y pega el N° de operación:
      <input id="yapeOp" placeholder="N° de operación" inputmode="numeric"></div>`:''}
    ${R.ahorro>0?`<div class="tot"><span class="k">Subtotal</span><span class="tach">${fmt(R.totalSinDesc)}</span></div>`:''}
    <div class="tot big"><span class="k">Total</span><span class="v">${fmt(R.total)}</span></div>
    ${R.ahorro>0?`<div class="save-badge" style="width:100%;justify-content:center;box-sizing:border-box;margin-bottom:10px">🎉 Ahorras ${fmt(R.ahorro)} en este pedido</div>`:''}
    <button class="wa" id="waCheckout"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.9-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.1.1-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.7.7-.9 1.6-.6 2.6.5 1.6 1.6 3 3.2 3.9 2 1.1 3.3 1 4.2.9.6-.1 1.4-.6 1.6-1.2.2-.5.2-1 .1-1.1z"/></svg>Finalizar pedido</button>`;

  $('#cartBot').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{ payMethod=b.dataset.pay; renderCart(); });
  wireEntregaToggle($('#cartBot'), ()=>renderCart());
  wireEntregaCollapse('c', ()=>renderCart());
  renderEntregaForm('c');
  $('#waCheckout').onclick = () => checkout(R);
}
function chgQty(key,d){ const i=CART.find(x=>x.key===key); if(!i)return;
  if(d>0){ const p=PROD_BY_ID[i.id]; const s=p?stockDe(p):null; if(s!=null && qtyEnCarrito(i.id)>=s){ toast('No hay más stock disponible'); return; }
    const cap=p?tierCapDe(p):null; if(cap!=null && i.qty>=cap){ toast(`Para más de ${cap} unidades, coordina por WhatsApp`); return; } }
  i.qty+=d; if(i.qty<1)CART=CART.filter(x=>x.key!==key); saveCart(); }
function setQty(key,val){ const i=CART.find(x=>x.key===key); if(!i)return;
  let v=parseInt((''+val).replace(/[^\d]/g,''),10); if(isNaN(v)||v<1)v=1;
  const p=PROD_BY_ID[i.id]; const s=p?stockDe(p):null;
  if(s!=null){ const otros=qtyEnCarrito(i.id)-i.qty; if(otros+v>s){ v=Math.max(1,s-otros); toast('Ajustado al stock disponible'); } }
  const cap=p?tierCapDe(p):null; if(cap!=null && v>cap){ v=cap; toast(`Para más de ${cap} unidades, coordina por WhatsApp`); }
  i.qty=v; saveCart(); }
function openCart(){ renderCart(); $('#drawer').classList.add('open'); $('#cartBackdrop').classList.add('open'); }
function closeCart(){ $('#drawer').classList.remove('open'); $('#cartBackdrop').classList.remove('open'); }
$('#openCart').onclick = openCart;
document.querySelectorAll('[data-close-cart]').forEach(el=>el.onclick=closeCart);
$('#cartBackdrop') && ($('#cartBackdrop').onclick=closeCart);

async function checkout(R){
  if(!CART.length){ toast('Tu pedido está vacío'); return; }
  if(!ENTREGA.modo){ toast('Elige cómo lo recibes: recojo o envío'); return; }
  if(!entregaValida()){ toast(ENTREGA.modo==='recojo'?'Pon tu nombre y celular':'Completa tus datos de envío'); return; }
  const op = ($('#yapeOp')?.value||'').trim();
  const entrega = entregaPayload();
  const nombre = ENTREGA.nombre||'';

  // Registrar la venta (no bloquea el pedido si falla)
  try{
    const items = R.lines.map(i => ({ id:i.id, nombre:i.nombre, marca:i.marca||'', ml:i.ml, qty:i.qty, precio:i.unit, total:i.lineTotal }));
    await sb.from('ventas').insert({
      cliente_nombre:nombre||null, cliente_telefono:(entrega.celular||entrega.telefono||null), cliente_direccion:(entrega.agencia||null),
      items, subtotal:R.totalSinDesc, descuento:R.ahorro, total:R.total,
      metodo_pago:payMethod, yape_operacion:(payMethod==='yape'?op:'')||null, estado:'nuevo', entrega
    });
  }catch(e){ console.warn('No se pudo registrar la venta:', e); }

  const itemsResumen = R.lines.filter(i=>i.tipo!=='regalo').map(i=>({ nombre:i.nombre, marca:i.marca, img:i.img, qty:i.qty, precio:i.unit }));
  CART=[]; saveCart();
  mostrarResumenPedido({ titulo:'¡Pedido recibido!', subtexto:'Comparte la imagen de tu pedido para coordinar tu pago y entrega.', items:itemsResumen, total:R.total, totalSinDesc:R.totalSinDesc, ahorro:R.ahorro, entrega });
}
